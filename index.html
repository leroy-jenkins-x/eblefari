<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf5e8">
  <meta name="description" content="До невозможности милая интерактивная история на 15 минут. Двое влюблённых, семь собак, змеи и безумная зелёная империя.">
  <title>eblefari · накорми пати</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="background-blooms" aria-hidden="true"><span>✿</span><span>✳</span><span>♡</span><span>✿</span></div>
  <div class="desktop-note" aria-hidden="true"><span class="note-flower">✿</span><p>маленькая история любви.<br>очень много ртов.</p><span>сделано для твоих пальчиков ♡</span></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Главная eblefari">eblefari<span>✿</span></a>
      <div class="top-actions"><button id="sound" class="icon-button" aria-label="Включить звук" aria-pressed="false">♫<span class="sound-off">×</span></button><button id="album" class="icon-button" aria-label="Познакомиться с семьёй">♡</button><button id="menu" class="icon-button" aria-label="Открыть меню истории">☰</button></div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="app-footer">целый дом главных героев <span>♡</span></footer>
  </div>
  <div id="pet-bubble" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="confetti" aria-hidden="true"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <noscript><div class="noscript">Этой истории нужен JavaScript. Включи его — собаки будут счастливы.</div></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
